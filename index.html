<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1724">
  <title>TERRPG — Blockworld</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand"><strong>TERRPG</strong><span>Blockworld</span></div>
      <div class="status">
        <span id="dayStatus">DAY</span>
        <span id="coords">0,0</span>
        <button id="saveButton" class="mini">SAVE</button>
        <button id="menuButton" class="mini">MENU</button>
      </div>
    </header>

    <section class="game-shell">
      <div class="viewport-wrap">
        <canvas id="world"></canvas>
        <div class="hud">
          <div class="health"><span>HP</span><div class="meter"><i id="hpFill"></i></div><b id="hpText">100/100</b></div>
          <div class="mana"><span>MP</span><div class="meter"><i id="mpFill"></i></div><b id="mpText">60/60</b></div>
          <div id="objective" class="objective"></div>
        </div>
        <div id="hotbar" class="hotbar"></div>
        <div class="touch">
          <button data-touch="left">◀</button><button data-touch="jump">▲</button><button data-touch="right">▶</button>
        </div>
      </div>

      <aside class="sidepanel">
        <div class="panel-tabs">
          <button data-view="stats" class="active">Stats</button>
          <button data-view="quests">Quests</button>
          <button data-view="crafting">Craft</button>
        </div>
        <div id="sideView" class="side-content"></div>
      </aside>
    </section>
  </main>

  <div id="menuOverlay" class="overlay hidden">
    <div class="menu-card">
      <h1>TERRPG</h1>
      <p class="subtitle">A 2D mining, building and RPG sandbox.</p>
      <div class="menu-grid">
        <button data-menu="resume" class="primary">RESUME</button>
        <button data-menu="inventory">INVENTORY</button>
        <button data-menu="crafting">CRAFTING</button>
        <button data-menu="character">CHARACTER</button>
        <button data-menu="map">WORLD MAP</button>
        <button data-menu="bestiary">BESTIARY</button>
        <button data-menu="quests">QUESTS</button>
        <button data-menu="achievements">ACHIEVEMENTS</button>
        <button data-menu="settings">SETTINGS</button>
        <button data-menu="save">SAVE / LOAD</button>
        <button data-menu="controls">CONTROLS</button>
        <button data-menu="main">MAIN MENU</button>
      </div>
      <div id="menuContent"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- index.html is intentionally only the game shell. Game systems live in JS files. -->
  <script src="js/data.js" defer></script>
  <script src="js/game.js" defer></script>
</body>
</html>
