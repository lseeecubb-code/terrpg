<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TERRPG</title><style>html,body{margin:0;overflow:hidden;background:#111;font-family:Arial}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}.p{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#071426cc;color:white}.c{background:#252b35;border:3px solid #ddd;border-radius:10px;padding:28px;text-align:center;width:min(400px,85vw)}button{display:block;width:100%;padding:13px;margin:10px 0;font-size:18px;font-weight:bold;background:#416fa8;color:#fff;border:2px solid #aaa;border-radius:7px}</style></head><body><canvas id="c"></canvas><div id="m" class="p"><div class="c"><h1>TERRPG</h1><p>Explore, mine and build.</p><button onclick="start()">PLAY</button><button onclick="controls()">CONTROLS</button></div></div><div id="p" class="p" style="display:none"><div class="c"><h1>PAUSED</h1><button onclick="pause(false)">RESUME</button><button onclick="location.reload()">MAIN MENU</button></div></div><script>
const C=document.getElementById('c'),x=C.getContext('2d');let W,H;function rs(){W=innerWidth;H=innerHeight;C.width=W;C.height=H}onresize=rs;rs();const T=24,ww=300,wh=100,A=0,G=1,D=2,S=3,Wd=4;let map=Array.from({length:wh},()=>Array(ww).fill(A)),h=[],seed=Math.random()*1e9|0;function r(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0,z=45;i<ww;i++){z=Math.max(30,Math.min(60,z+(r()*3|0)-1));h[i]=z;for(let y=z;y<wh;y++)map[y][i]=y==z?G:y<z+5?D:S}for(let i=0;i<400;i++){let q=r()*ww|0,y=50+r()*40|0;for(let j=0;j<4;j++){map[y]?.[q]=A;q+=(r()*3|0)-1;y+=(r()*3|0)-1}}let P={x:ww*T/2,y:0,w:16,h:34,vx:0,vy:0,g:0,hp:100},cam=0,cy=0,run=false,stop=false,keys={},sel=0,inv={[D]:30,[S]:20,[Wd]:10},bar=[D,S,Wd,G],mouse={x:0,y:0,d:0,r:0};function solid(a){return a==G||a==D||a==S||a==Wd}function hit(q,y,w,hh){for(let yy=y/T|0;yy<=(y+hh-1)/T;yy++)for(let xx=q/T|0;xx<=(q+w-1)/T;xx++)if(solid(map[yy]?.[xx]??S))return 1;return 0}function mv(e,dt){e.x+=e.vx*dt;if(hit(e.x,e.y,e.w,e.h)){e.x-=e.vx*dt;e.vx=0}e.y+=e.vy*dt;e.g=0;if(hit(e.x,e.y,e.w,e.h)){if(e.vy>0){e.y=((e.y+e.h)/T|0)*T-e.h;e.g=1}else e.y=((e.y/T|0)+1)*T;e.vy=0}}function start(){run=1;document.getElementById('m').style.display='none'}function controls(){alert('A/D or arrows: move\nSpace/W: jump\nLeft click: mine\nRight click: place\n1-4: hotbar\nEsc: pause')}function pause(v){stop=v;document.getElementById('p').style.display=v?'flex':'none'}onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key>='1'&&e.key<='4')sel=+e.key-1;if(e.key==='Escape'&&run)pause(!stop)};onkeyup=e=>keys[e.key.toLowerCase()]=0;C.onmousemove=e=>{mouse.x=e.clientX;mouse.y=e.clientY};C.onmousedown=e=>{if(e.button==0)mouse.d=1;if(e.button==2)mouse.r=1};onmouseup=e=>{mouse.d=mouse.r=0};C.oncontextmenu=e=>e.preventDefault();function upd(dt){if(!run||stop)return;P.vx=keys.a||keys.arrowleft?-170:keys.d||keys.arrowright?170:P.vx*.8;if((keys[' ']||keys.w)&&P.g)P.vy=-370;P.vy+=900*dt;mv(P,dt);cam+=(P.x-W/2-cam)*dt*8;cy+=(P.y-H/2-cy)*dt*8;cam=Math.max(0,Math.min(ww*T-W,cam));cy=Math.max(0,Math.min(wh*T-H,cy));let tx=(mouse.x+cam)/T|0,ty=(mouse.y+cy)/T|0;if(Math.hypot(tx*T+12-P.x,ty*T+12-P.y)<110){if(mouse.d&&map[ty]?.[tx]){let t=map[ty][tx];map[ty][tx]=A;inv[t]=(inv[t]||0)+1;mouse.d=0}if(mouse.r&&map[ty]?.[tx]===A&&inv[bar[sel]]>0){map[ty][tx]=bar[sel];inv[bar[sel]]--;mouse.r=0}}}function draw(){let day=.5+.5*Math.sin(Date.now()/5000);x.fillStyle=`rgb(${35+40*day},${70+80*day},${120+100*day})`;x.fillRect(0,0,W,H);for(let y=cy/T|0;y<(cy+H)/T+1;y++)for(let q=cam/T|0;q<(cam+W)/T+1;q++){let t=map[y]?.[q];if(t){x.fillStyle=t==G?'#55a844':t==D?'#8a5735':t==S?'#777b82':'#9b6639';x.fillRect(q*T-cam,y*T-cy,T,T)}}x.fillStyle='#d98a55';x.fillRect(P.x-cam,P.y-cy,P.w,18);x.fillStyle='#3e62a8';x.fillRect(P.x-cam,P.y-cy+18,P.w,16);x.fillStyle='#0009';x.fillRect(10,10,205,55);x.fillStyle='#fff';x.font='bold 16px Arial';x.fillText('TERRPG',20,30);x.fillText('HP '+P.hp+'/100',20,51);for(let i=0;i<bar.length;i++){let q=W/2-116+i*58;x.fillStyle=i==sel?'#ddd':'#333c';x.fillRect(q,H-65,54,54);x.fillStyle=bar[i]==G?'#55a844':bar[i]==D?'#8a5735':bar[i]==S?'#777b82':'#9b6639';x.fillRect(q+13,H-52,28,28);x.fillStyle='#fff';x.fillText(i+1,q+4,H-50);x.fillText(inv[bar[i]]||0,q+35,H-18)}}function loop(t){let dt=Math.min(.033,(t-(loop.t||t))/1000);loop.t=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
