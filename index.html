function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function makeWorld(seed){const r=rng(seed),m=Array.from({length:WORLD_H},()=>Array(WORLD_W).fill(null)),surface=[];let h=52;for(let x=0;x<WORLD_W;x++){h=Math.max(38,Math.min(68,h+(r()*3|0)-1));surface[x]=h;for(let y=h;y<WORLD_H;y++){let z=r();m[y][x]=y===h?"grass":y<h+5?"dirt":z<.012?"gold":z<.035?"iron":z<.065?"coal":"stone"}}for(let i=0;i<900;i++){let cx=r()*WORLD_W|0,cy=58+(r()*55|0);for(let j=0;j<8;j++){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let xx=cx+dx,yy=cy+dy;if(xx>2&&xx<WORLD_W-3&&yy>surface[xx]+7&&yy<WORLD_H-3)m[yy][xx]=null}cx+=(r()*3|0)-1;cy+=(r()*3|0)-1}}for(let x=5;x<WORLD_W-5;x++)if(r()<.07){let base=surface[x],th=4+(r()*3|0);for(let y=base-1;y>base-th-1;y--)m[y][x]="wood";for(let yy=base-th-3;yy<=base-th;yy++)for(let xx=x-3;xx<=x+3;xx++)if(m[yy]?.[xx]===null&&Math.abs(xx-x)+Math.abs(yy-(base-th-1))<5)m[yy][xx]="leaves"}return{m,surface}}
function defaultState(){return{seed:Date.now()>>>0,world:null,time:0,player:{x:0,y:0,vx:0,vy:0,w:16,h:34,ground:false,hp:100,mp:60},level:1,xp:0,nextXp:100,coin:100,inventory:{dirt:40,stone:25,wood:15,torch:20,iron:0,coal:0,gold:0,crystal:0,obsidian:0,potion:5},equipment:{weapon:"wooden sword",armor:"cloth armor",offhand:"shield",head:null,feet:"boots",trinket:null},hotbar:["dirt","stone","wood","torch","iron","coal","gold","crystal","wooden sword","potion"],selected:0,story:{chapter:0,fracture:0,kills:{},ending:null,journal:[]},stats:{str:5,agi:5,vit:5,foc:5,statPoints:0,skillPoints:0},perks:[],spells:["ember spark","mend"],companions:{recruited:["mira"],active:["mira"],affinity:{mira:0,kael:0,nyx:0}},achievements:[],settings:{shake:true,help:true}}}
let S=null;try{S=JSON.parse(localStorage.getItem("terrpg.onefile"))}catch{}let state=S&&S.seed?Object.assign(defaultState(),S):defaultState();function ensureWorld(){if(!state.world)state.world=makeWorld(state.seed);return state.world}function save(){try{localStorage.setItem("terrpg.onefile",JSON.stringify(state))}catch{}}

function collides(px,py,w,h){const m=ensureWorld().m,a=px/TILE|0,b=(px+w-1)/TILE|0,c=py/TILE|0,d=(py+h-1)/TILE|0;for(let y=c;y<=d;y++)for(let x=a;x<=b;x++)if(m[y]?.[x]&&SOLID.has(m[y][x]))return true;return false}
function move(e,dt){e.x+=e.vx*dt;if(collides(e.x,e.y,e.w,e.h)){e.x-=e.vx*dt;e.vx=0}e.y+=e.vy*dt;e.ground=false;if(collides(e.x,e.y,e.w,e.h)){if(e.vy>0){e.y=((e.y+e.h)/TILE|0)*TILE-e.h;e.ground=true}else e.y=((e.y/TILE|0)+1)*TILE;e.vy=0}}
function cursor(){return{x:Math.floor((mouse.x+cam.x)/TILE),y:Math.floor((mouse.y+cam.y)/TILE)}}let cam={x:0,y:0},mouse={x:0,y:0};
function reach(q){const p=state.player;return Math.hypot(q.x*TILE+12-(p.x+8),q.y*TILE+12-(p.y+17))<TILE*6}

let mobs=[];function spawnMobs(){if(mobs.length)return;const r=rng(state.seed^12345),w=ensureWorld(),names=Object.keys(ENEMIES);for(let i=0;i<24;i++){const n=names[i%names.length],q=20+(r()*(WORLD_W-40)|0),e=ENEMIES[n];mobs.push({name:n,x:q*TILE,y:(w.surface[q]-1)*TILE,w:22,h:22,vx:0,vy:0,ground:false,hp:e[0],max:e[0],xp:e[3],alive:true})}}
function attack(q){const e=mobs.find(v=>v.alive&&Math.abs(v.x-(q.x*TILE+12))<27&&Math.abs(v.y-(q.y*TILE+12))<30);if(!e)return false;const w=RPG_ITEMS[state.equipment.weapon]||{damage:3},crit=Math.random()<((w.crit||0)+state.stats.agi-5)/100,d=Math.max(1,Math.floor((7+state.level+(w.damage||0)+Math.random()*8)*(crit?1.7:1)));e.hp-=d;if(e.hp<=0){e.alive=false;state.story.kills[e.name]=(state.story.kills[e.name]||0)+1;state.coin+=Math.max(5,e.xp/8|0);gainXp(e.xp);toast("Defeated "+e.name);checkAchievements();progressStory()}else toast((crit?"CRIT ":"")+"-"+d);return true}

function advanceChapter(){if(state.story.chapter>=10){showDialog("THE LAST SAVE","The file is waiting. Choose what this world remembers.",Object.entries({remember:"THE WORLD THAT REMEMBERED",release:"THE QUIET END",rewrite:"VERSION TWO"}).map(([id,label])=>({label,onChoose:()=>{state.story.ending=id;save();toast(label)}})));return}state.story.chapter++;state.story.fracture=state.story.chapter;state.story.journal.push({chapter:state.story.chapter,text:SCENES[state.story.chapter].join(" ")});toast("Chapter "+state.story.chapter+" unlocked");save();renderAll()}

function renderSide(v){document.querySelectorAll(".panel-tabs button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));const e=sideView;if(v==="stats")e.innerHTML='<div class="side-content"><h3>Hero</h3><div class="card-row">Level '+state.level+' · XP '+state.xp+'/'+state.nextXp+'</div><div class="card-row">STR '+state.stats.str+' · AGI '+state.stats.agi+'</div><div class="card-row">VIT '+state.stats.vit+' · FOC '+state.stats.foc+'</div><div class="card-row">Coins '+state.coin+'</div><div class="card-row">Companions '+state.companions.recruited.join(", ")+'</div></div>';else if(v==="quests")e.innerHTML='<div class="side-content"><h3>Campaign</h3><div class="card-row">'+objectiveText()+'</div>'+CHAPTERS.map((c,i)=>'<div class="card-row"><b>'+i+" · "+c[0]+"</b><div class="small muted">"+c[1]+" · "+(c[2]||"regional goal")+"</div></div>").join("")+"</div>";else e.innerHTML='<div class="side-content"><h3>Crafting</h3>'+Object.keys(RECIPES).slice(0,12).map(n=>'<div class="card-row"><b>'+n+'</b><div class="small muted">'+Object.entries(RECIPES[n]).map(([a,b])=>a+' × '+b).join(", ")+'</div><button class="btn" onclick="craftItem(\''+n+'\')">CRAFT</button></div>').join("")+"</div>"}
function objectiveText(){const c=CHAPTERS[state.story.chapter];return c[2]?"Chapter "+state.story.chapter+": reach Lv "+c[1]+" and defeat "+c[2]:"Chapter "+state.story.chapter+": reach Lv "+c[1]+" and explore "+c[0]}
function renderHud(){const max=100+(state.level-1)*8,mp=60+(state.stats.foc-5)*2;day=Math.sin(state.time*.08)>0?"DAY":"NIGHT";dayStatus.textContent=day;coords.textContent=(state.player.x/TILE|0)+", "+(state.player.y/TILE|0);hpFill.style.width=Math.max(0,state.player.hp/max*100)+"%";mpFill.style.width=Math.max(0,state.player.mp/mp*100)+"%";hpText.textContent=Math.max(0,state.player.hp|0)+"/"+max;mpText.textContent=(state.player.mp|0)+"/"+mp;objective.textContent=objectiveText()}
function renderAll(){renderHotbar();renderSide("stats");renderHud()}
function menuHome(){menuContent.innerHTML='<div class="info">Manage the sandbox and RPG campaign from here.<br><br>Terraria-like world systems: mining, building, caves, trees, ores, enemies, day/night, hotbar, crafting, progression and exploration.<br><br>RPG systems: chapters, story scenes, bosses, gear, spells, perks, companions, bestiary, quests, achievements and save codes.</div>'}
function renderMenu(n){if(n==="inventory")menuContent.innerHTML="<h3>INVENTORY</h3>"+Object.entries(state.inventory).filter(([,v])=>v>0).map(([a,b])=>'<div class="card-row">'+itemEmoji(a)+" <b>"+a+"</b> × "+b+"</div>").join("");else if(n==="character")menuContent.innerHTML="<h3>CHARACTER</h3><div class="card-row">Level "+state.level+"</div>"+Object.entries(state.equipment).map(([a,b])=>'<div class="card-row">'+a+": "+(b||"none")+"</div>").join("")+'<div class="card-row">Spells: '+state.spells.join(", ")+'</div>';else if(n==="crafting"){menuContent.innerHTML="<h3>CRAFTING</h3>"+Object.keys(RECIPES).map(x=>'<div class="card-row"><b>'+x+'</b><div class="small muted">'+Object.entries(RECIPES[x]).map(([a,b])=>a+" × "+b).join(", ")+'</div><button class="btn" onclick="craftItem(\''+x+'\')">CRAFT</button></div>').join("")}else if(n==="quests")menuContent.innerHTML="<h3>QUESTS</h3>"+CHAPTERS.map((c,i)=>'<div class="card-row"><b>Chapter '+i+": "+c[0]+"</b><div class="small muted">"+c[1]+" · "+(c[2]||"regional objective")+"</div></div>").join("");else if(n==="bestiary")menuContent.innerHTML="<h3>BESTIARY</h3>"+Object.entries(ENEMIES).map(([a,e])=>'<div class="card-row"><b>'+a+"</b><div class="small muted">HP "+e[0]+" · Damage "+e[1]+"–"+e[2]+" · XP "+e[3]+" · Defeats "+(state.story.kills[a]||0)+"</div></div>").join("");else if(n==="achievements")menuContent.innerHTML="<h3>ACHIEVEMENTS</h3>"+ACHIEVEMENTS.map(a=>'<div class="card-row"><b>'+((state.achievements||[]).includes(a[0])?"✓":"○")+" "+a[0]+"</b><div class="small muted">"+a[1]+"</div></div>").join("");else if(n==="controls")menuContent.innerHTML='<h3>CONTROLS</h3><div class="info"><b>A/D or Arrows</b> move · <b>Space/W</b> jump · <b>Left click</b> mine/attack · <b>Right click</b> place · <b>1–0</b> hotbar · <b>E</b> inventory · <b>C</b> crafting · <b>M</b> map · <b>Esc</b> menu</div>';else if(n==="settings")menuContent.innerHTML='<h3>SETTINGS</h3><button class="btn" onclick="state.settings.help=!state.settings.help;save();renderMenu(\'settings\')">Help: '+(state.settings.help?"ON":"OFF")+"</button>";else if(n==="save")menuContent.innerHTML='<h3>SAVE / LOAD</h3><button class="btn" onclick="save();toast(\'Saved\')">SAVE</button><button class="btn" onclick="document.getElementById(\'saveArea\').value=btoa(unescape(encodeURIComponent(JSON.stringify(state))))">COPY CODE TO BOX</button><textarea id="saveArea" style="width:100%;height:110px;background:#0b1118;color:#fff;border:1px solid #52687c"></textarea><button class="btn" onclick="try{state=Object.assign(freshState(),JSON.parse(decodeURIComponent(escape(atob(saveArea.value.trim())))));ensureWorld();mobs=[];spawn();spawnMobs();save();toast(\'Loaded\');renderAll()}catch(e){toast(\'Invalid code\')}">LOAD</button>';else if(n==="map"){const w=ensureWorld();menuContent.innerHTML='<h3>WORLD MAP</h3><canvas id="bigMap" width="700" height="360" style="width:100%;background:#071019"></canvas>';requestAnimationFrame(()=>{const m=bigMap,g=m.getContext("2d"),sx=m.width/WORLD_W,sy=m.height/WORLD_H;for(let y=0;y<WORLD_H;y++)for(let x=0;x<WORLD_W;x++){const t=w.m[y][x];g.fillStyle=t?COLORS[t]||"#888":"#071019";g.fillRect(x*sx,y*sy,Math.ceil(sx),Math.ceil(sy))}g.fillStyle="#fff";g.fillRect(state.player.x/TILE*sx-2,state.player.y/TILE*sy-2,4,4)})}else menuHome()}
function checkAchievements(){const k=Object.values(state.story.kills).reduce((a,b)=>a+b,0);const done=new Set(state.achievements);if(state.world)done.add("First Steps");if(state.inventory.gold>0)done.add("Treasure Hunter");if((state.story.journal.length)>=100)done.add("Miner");if(k>=25)done.add("Hunter");if((state.story.chapter)>=1)done.add("Wayfarer");if((state.story.kills["the unnamed king"]||0)>=1)done.add("Godfall");if((state.story.kills["the archivist"]||0)>=1)done.add("Archivist");if((state.story.kills["the first hero"]||0)>=1)done.add("First Hero");if((state.story.kills["the editor"]||0)>=1)done.add("Redline");if(state.story.ending)done.add("Version Two");state.achievements=[...done];}
function respawnPlayer(){spawn();state.player.hp=Math.max(1,75);state.coin=Math.max(0,state.coin-25);toast("Respawned — 25 coins lost")}
let day="DAY";
function update(dt){if(!gameRunning())return;state.time+=dt;spawnMobs();const p=state.player;const l=keys.has("a")||keys.has("arrowleft")||input.l,r=keys.has("d")||keys.has("arrowright")||input.r;p.vx=l?-180:r?180:p.vx*.84;if((keys.has(" ")||keys.has("w")||input.j)&&p.ground)p.vy=-420;p.vy+=1100*dt;move(p,dt);p.hp=Math.min(100+(state.level-1)*8,p.hp+.15*dt);p.mp=Math.min(60+(state.stats.foc-5)*2,p.mp+.1*dt);for(const e of mobs)if(e.alive){e.vy+=1050*dt;e.vx*=.97;if(Math.abs(p.x-e.x)<300)e.vx=p.x<e.x?35:-35;if(e.ground&&Math.random()<dt*.8)e.vy=-260;move(e,dt);if(Math.abs(p.x-e.x)<24&&Math.abs(p.y-e.y)<34){p.hp-=14*dt;if(p.hp<=0)respawnPlayer()}}const q=cursor();if(mouseState.left&&reach(q)){if(!attack(q))mine(q);mouseState.left=false}if(mouseState.right){placeBlock(q);mouseState.right=false}cam.x+=(p.x-VW*.42-cam.x)*Math.min(1,dt*7);cam.y+=(p.y-VH*.42-cam.y)*Math.min(1,dt*7);cam.x=Math.max(0,Math.min(WORLD_W*TILE-VW,cam.x));cam.y=Math.max(0,Math.min(WORLD_H*TILE-VH,cam.y))}
function placeBlock(q){const w=ensureWorld(),t=state.hotbar[state.selected];if(!SOLID.has(t)||!reach(q)||w.m[q.y]?.[q.x]||(state.inventory[t]||0)<1)return;w.m[q.y][q.x]=t;state.inventory[t]--;toast("Placed "+t)}
function gameRunning(){return playing&&!paused}
function draw(){const daylight=.5+.5*Math.sin(state.time*.08);ctx.fillStyle="rgb("+(35+55*daylight)+","+(70+95*daylight)+","+(120+105*daylight)+")";ctx.fillRect(0,0,VW,VH);const w=ensureWorld();const x0=Math.max(0,Math.floor(cam.x/TILE)-1),x1=Math.min(WORLD_W-1,Math.floor((cam.x+VW)/TILE)+1),y0=Math.max(0,Math.floor(cam.y/TILE)-1),y1=Math.min(WORLD_H-1,Math.floor((cam.y+VH)/TILE)+1);for(let y=y0;y<=y1;y++)for(let xx=x0;xx<=x1;xx++){const t=w.m[y]?.[xx];if(!t)continue;ctx.fillStyle=COLORS[t]||"#888";ctx.fillRect(xx*TILE-cam.x,y*TILE-cam.y,TILE,TILE);if(t==="grass"){ctx.fillStyle="#79c95c";ctx.fillRect(xx*TILE-cam.x,y*TILE-cam.y,TILE,4)}}for(const e of mobs)if(e.alive){ctx.fillStyle=e.name.includes("king")||e.name.includes("save")||e.name.includes("author")?"#c34b9a":"#67c956";ctx.fillRect(e.x-cam.x,e.y-cam.y,e.w,e.h)}const p=state.player;ctx.fillStyle="#d68d5d";ctx.fillRect(p.x-cam.x,p.y-cam.y,p.w,18);ctx.fillStyle="#435eaa";ctx.fillRect(p.x-cam.x,p.y-cam.y+18,p.w,16);const q=cursor();if(reach(q)){ctx.strokeStyle="#fff";ctx.strokeRect(q.x*TILE-cam.x+1,q.y*TILE-cam.y+1,TILE-2,TILE-2)}}
function loop(t){const dt=Math.min(.034,(t-(loop.t||t))/1000);loop.t=t;if(gameRunning())update(dt);draw();requestAnimationFrame(loop)}
addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(e.key>="1"&&e.key<="9"){state.selected=+e.key-1;renderHotbar()}if(e.key==="0"){state.selected=9;renderHotbar()}if(e.key.toLowerCase()==="e")openPanel("inventory");if(e.key.toLowerCase()==="c")openPanel("crafting");if(e.key.toLowerCase()==="m")openPanel("map");if(e.key==="Escape"){if(playing)openMenu()}});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
document.getElementById("world").addEventListener("mousemove",e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});document.getElementById("world").addEventListener("mousedown",e=>{if(!playing)return;if(e.button===0)mouseState.left=true;if(e.button===2)mouseState.right=true});document.getElementById("world").addEventListener("contextmenu",e=>e.preventDefault());
function openPanel(n){playing=false;menuOverlay.classList.remove("hidden");renderMenu(n)}function openMenu(){playing=false;menuOverlay.classList.remove("hidden");menuHome()}function resumeGame(){menuOverlay.classList.add("hidden");playing=true;paused=false}function newWorld(){state=freshState();state.world=makeWorld(state.seed);spawn();mobs=[];save();resumeGame();renderAll();toast("New world created")}
document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>{const n=b.dataset.menu;if(n==="resume")resumeGame();else if(n==="main"){renderMenu("main")}else renderMenu(n)});document.querySelectorAll(".panel-tabs button").forEach(b=>b.onclick=()=>renderSide(b.dataset.view));document.getElementById("menuButton").onclick=()=>openMenu();document.getElementById("saveButton").onclick=()=>{save();toast("Saved")};document.querySelectorAll("[data-touch]").forEach(b=>{b.addEventListener("touchstart",e=>{e.preventDefault();input[b.dataset.touch]=true});b.addEventListener("touchend",e=>{e.preventDefault();input[b.dataset.touch]=false})});
if(!state.world){newWorld()}else{spawn();spawnMobs();renderAll()}requestAnimationFrame(loop);
})();
</script></body></html>
