<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TERRPG</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,sans-serif}
    #game{display:block;width:100vw;height:100vh;touch-action:none;outline:none}
    #ui{position:fixed;inset:0;pointer-events:none}
    .hud{position:absolute;left:18px;top:18px;padding:12px 16px;background:rgba(7,13,24,.78);border:1px solid rgba(255,255,255,.15);border-radius:10px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.3)}
    .skills{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px}
    .skill{min-width:72px;padding:8px;text-align:center;background:rgba(7,13,24,.85);border:1px solid rgba(255,255,255,.2);border-radius:9px;font-weight:bold}
    .skill small{font-weight:normal;opacity:.8}
    #error{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:#07111f;color:#fff;text-align:center;z-index:50}
    #error .box{max-width:720px;padding:24px;background:#101d30;border:1px solid #3b506d;border-radius:14px}
    #error pre{white-space:pre-wrap;text-align:left;color:#ffb4b4;font-size:12px}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="error"><div class="box"><h2>TERRPG could not start</h2><p id="errorText">Unknown error.</p><pre id="errorDetails"></pre></div></div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
