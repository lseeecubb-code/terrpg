<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TERRPG</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#game{display:block;width:100%;height:100%;touch-action:none;outline:0}#ui{position:fixed;inset:0;pointer-events:none}#ui .panel{pointer-events:auto;position:absolute;left:16px;top:16px;min-width:260px;padding:14px;border:1px solid #34435b;border-radius:10px;background:rgba(8,12,20,.86);box-shadow:0 10px 30px rgba(0,0,0,.35)}#ui button{pointer-events:auto;border:1px solid #536783;border-radius:7px;background:#182338;color:#fff;padding:8px 12px;cursor:pointer}#ui button:hover{background:#24334d}.hud{position:absolute;left:16px;bottom:16px;padding:10px 12px;border-radius:9px;background:rgba(8,12,20,.78);border:1px solid #34435b}.skills{display:flex;gap:6px;margin-top:7px}.skill{padding:5px 8px;border:1px solid #536783;border-radius:6px;background:#121b2b}.muted{opacity:.7;font-size:12px}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
